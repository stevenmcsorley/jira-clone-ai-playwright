name: Deploy to Pi

# IMPORTANT: `ossicone` is this repo's working/default branch, NOT `main`.
on:
  push:
    branches: [ossicone]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Rollback: image tag / git SHA to redeploy (blank = build & deploy HEAD)"
        required: false
        default: ""

concurrency:
  group: deploy-ossicone
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ossicone_oauth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit
        working-directory: backend
      - run: npm ci --no-audit
        working-directory: mcp
      - run: npm run test:oauth
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ossicone_oauth_test
      - run: npm install --no-audit && npm test && npm run build
        working-directory: frontend
  deploy:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: stevenmcsorley/pi-ci/.github/workflows/pi-deploy-ghcr.yml@main
    with:
      app_dir: ossicone
      compose_args: "-f docker-compose.prod.yml --env-file .env.prod"
      services: "backend frontend ossicone-mcp"
      tag_var: OSSICONE_TAG
      health_url: "http://127.0.0.1:8087/api/auth/config"
      health_match: "openSignup"
      app_label: Ossicone
      rollback_tag: ${{ github.event.inputs.rollback_tag || '' }}
    secrets:
      deploy_webhook: ${{ secrets.RELAY_DEPLOY_WEBHOOK }}
