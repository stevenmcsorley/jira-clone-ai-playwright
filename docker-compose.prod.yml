# Production stack for the Pi (behind the Cloudflare tunnel).
#   cp .env.prod.example .env.prod   # then fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Only the frontend port (${WEB_PORT}) is published; everything else is internal.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ossicone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ossicone
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ossicone -d ossicone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgres://ossicone:${POSTGRES_PASSWORD}@postgres:5432/ossicone
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      FRONTEND_URL: ${PUBLIC_URL:-https://ossicone.halfagiraf.com}
      PORT: 4000
      # Report unhandled 5xx errors to Skylark (no-op unless the token is set).
      SKYLARK_URL: ${SKYLARK_URL:-https://skylark.halfagiraf.com}
      SKYLARK_TOKEN: ${SKYLARK_TOKEN:-}
      # Public self-service signup; each account still gets exactly one workspace.
      OPEN_SIGNUP: ${OPEN_SIGNUP:-false}
      # File uploads OFF by default so open signup can't turn the box into a file depot.
      UPLOADS_ENABLED: ${UPLOADS_ENABLED:-false}
      # Deliberate schema management: run migrations on boot (src/migrations/)
      TYPEORM_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/auth/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ossicone-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    environment:
      OSSICONE_URL: http://backend:4000
      PORT: 3000
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_SKYLARK_URL: ${VITE_SKYLARK_URL:-https://skylark.halfagiraf.com}
        VITE_SKYLARK_TOKEN: ${SKYLARK_TOKEN:-}
    container_name: ossicone-web
    healthcheck:
      # Use 127.0.0.1, not localhost — localhost resolves to ::1 (IPv6) in the
      # nginx:alpine image but nginx listens on IPv4 only, so localhost is refused.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default
      - tunnel
    ports:
      # Local debug only — public traffic arrives via the Cloudflare tunnel
      - "127.0.0.1:${WEB_PORT:-8087}:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  tunnel:
    external: true
    name: halfagiraf_web

volumes:
  pgdata:
  redisdata:
  uploads:
