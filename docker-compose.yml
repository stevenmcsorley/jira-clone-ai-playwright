services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ossicone
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ossicone
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ossicone -d ossicone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npm", "run", "start:dev"]
    environment:
      DATABASE_URL: postgres://ossicone:secret@postgres:5432/ossicone
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      OPEN_SIGNUP: "true"
      # Off by default in prod; on locally so the attachment flow is testable.
      UPLOADS_ENABLED: "true"
      # Poll for file changes - native FS events do not cross the Windows bind mount
      TSC_WATCHFILE: DynamicPriorityPolling
      CHOKIDAR_USEPOLLING: "true"
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/usr/src/app
      # Named volume so the image's Linux node_modules (incl. native bcrypt)
      # aren't shadowed by host-installed Windows modules
      - backend_node_modules:/usr/src/app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: ws://localhost:4000
      # Poll for file changes - native FS events do not cross the Windows bind mount
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      # Mount entire frontend directory for development
      - ./frontend:/usr/src/app
      # Use named volume for node_modules to avoid conflicts
      - frontend_node_modules:/usr/src/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
  backend_node_modules: